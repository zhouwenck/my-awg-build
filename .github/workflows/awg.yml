name: Build AmneziaWG for ImmortalWrt

on:
  workflow_dispatch:
    inputs:
      version:
        description: "ImmortalWrt 版本号"
        required: true
        default: "25.12.1"
      target:
        description: "target，例如 x86 / mediatek / ramips / rockchip"
        required: true
        default: "x86"
      subtarget:
        description: "subtarget，例如 64 / filogic / mt7621 / armv8"
        required: true
        default: "64"
      awg_repo:
        description: "AmneziaWG 包源码仓库"
        required: true
        default: "https://github.com/Slava-Shchipunov/awg-openwrt.git"

env:
  SDK_CACHE: /home/runner/sdk-cache

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev file \
            wget zstd curl aria2

      - name: 恢复 SDK 缓存
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SDK_CACHE }}
          key: sdk-${{ inputs.version }}-${{ inputs.target }}-${{ inputs.subtarget }}

      - name: 下载 SDK（多镜像多线程）
        if: steps.cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: |
          set -e
          mkdir -p "$SDK_CACHE"
          REL="releases/${{ inputs.version }}/targets/${{ inputs.target }}/${{ inputs.subtarget }}"

          MIRRORS="
          https://downloads.immortalwrt.org
          https://mirrors.vsean.net/openwrt
          https://mirrors.sjtug.sjtu.edu.cn/immortalwrt
          https://mirror.nju.edu.cn/immortalwrt
          https://mirrors.ustc.edu.cn/immortalwrt
          "

          # 先随便找一个能列目录的镜像，拿到文件名
          SDK_FILE=""
          for M in $MIRRORS; do
            echo "列目录: $M/$REL/"
            SDK_FILE=$(curl -fsSL --max-time 30 "$M/$REL/" \
              | grep -oE 'immortalwrt-sdk-[^"<>]+\.tar\.zst' | head -n1) && \
              [ -n "$SDK_FILE" ] && { echo "文件名: $SDK_FILE"; break; }
            SDK_FILE=""
          done
          [ -n "$SDK_FILE" ] || { echo "所有镜像都取不到文件名，检查 version/target/subtarget"; exit 1; }

          # 把所有镜像的 URL 一起丢给 aria2c，多线程并发拉
          URLS=""
          for M in $MIRRORS; do URLS="$URLS $M/$REL/$SDK_FILE"; done

          aria2c -x16 -s16 -k1M \
            --max-tries=5 --retry-wait=3 \
            --connect-timeout=15 --timeout=30 \
            --console-log-level=warn --summary-interval=10 \
            --allow-overwrite=true --auto-file-renaming=false \
            -d "$SDK_CACHE" -o sdk.tar.zst $URLS

          ls -lh "$SDK_CACHE"

      - name: 解压 SDK
        run: |
          set -e
          test -s "$SDK_CACHE/sdk.tar.zst"
          mkdir sdk
          tar --zstd -xf "$SDK_CACHE/sdk.tar.zst" -C sdk --strip-components=1
          ls sdk

      - name: 拉取 AmneziaWG 包源码
        working-directory: sdk
        run: |
          set -e
          git clone --depth=1 "${{ inputs.awg_repo }}" /tmp/awg
          for p in kmod-amneziawg amneziawg-tools luci-proto-amneziawg luci-app-amneziawg; do
            if [ -d "/tmp/awg/$p" ]; then
              cp -r "/tmp/awg/$p" package/
              echo "已加入: $p"
            fi
          done

      - name: 更新 feeds 并生成配置
        working-directory: sdk
        run: |
          set -e
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          printf '%s\n' \
            'CONFIG_PACKAGE_kmod-amneziawg=m' \
            'CONFIG_PACKAGE_amneziawg-tools=y' \
            'CONFIG_PACKAGE_luci-proto-amneziawg=y' >> .config
          make defconfig
          grep -i amneziawg .config || true

      - name: 下载源码并修正 PKG_MIRROR_HASH
        working-directory: sdk
        run: |
          set -e
          for p in kmod-amneziawg amneziawg-tools luci-proto-amneziawg; do
            [ -d "package/$p" ] || continue
            echo "===== download $p ====="
            make "package/$p/download" V=s
            echo "===== check + fixup $p ====="
            make "package/$p/check" FIXUP=1 V=s || true
            grep -H 'PKG_MIRROR_HASH' "package/$p/Makefile" || true
          done

      - name: 编译
        working-directory: sdk
        run: |
          set -e
          mkdir -p ../logs
          for p in kmod-amneziawg amneziawg-tools luci-proto-amneziawg; do
            [ -d "package/$p" ] || continue
            echo "===== build $p ====="
            make -j$(nproc) "package/$p/compile" V=s 2>&1 | tee "../logs/$p.log" \
              || make -j1 "package/$p/compile" V=s 2>&1 | tee -a "../logs/$p.log"
          done

      - name: 收集产物
        run: |
          mkdir -p out
          find sdk/bin -type f \( -name "*amneziawg*.apk" -o -name "*amneziawg*.ipk" \) \
            -exec cp -v {} out/ \;
          echo "===== 产物 ====="
          ls -lh out/
          test -n "$(ls -A out/)"

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: amneziawg-${{ inputs.version }}-${{ inputs.target }}-${{ inputs.subtarget }}
          path: out/*
          if-no-files-found: error

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/
          if-no-files-found: ignore
