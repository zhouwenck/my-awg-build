name: Build AWG for ImmortalWrt 25.12.1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch and Setup ImmortalWrt 25.12.1 SDK
        run: |
          # 1. 动态获取 ImmortalWrt 25.12.1 x86/64 官方 SDK 的准确下载地址
          SDK_FILENAME=$(curl -s https://downloads.immortalwrt.org/releases/25.12.1/targets/x86/64/ | grep -oE 'immortalwrt-sdk-25\.12\.1-x86-64[^"]+\.tar\.xz' | head -n 1)
          echo "Found SDK: $SDK_FILENAME"
          
          wget "https://downloads.immortalwrt.org/releases/25.12.1/targets/x86/64/$SDK_FILENAME"
          tar -xf immortalwrt-sdk-*.tar.xz
          mv immortalwrt-sdk-* sdk
          cd sdk
          
          # 2. 引入 Amnezia 官方源码
          echo "src-git amneziawg https://github.com/amnezia-vpn/amneziawg-openwrt.git" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          # 3. 写入 AWG 编译配置
          make defconfig
          echo "CONFIG_PACKAGE_kmod-amneziawg=m" >> .config
          echo "CONFIG_PACKAGE_amneziawg-tools=m" >> .config
          echo "CONFIG_PACKAGE_luci-app-amneziawg=m" >> .config
          make defconfig

      - name: Compile AWG Packages
        run: |
          cd sdk
          make package/amneziawg/compile V=s -j$(nproc)

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-25.12.1-AWG-x86_64-APKs
          path: sdk/bin/packages/x86_64/amneziawg/*.apk
