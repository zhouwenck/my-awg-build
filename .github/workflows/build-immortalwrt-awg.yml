name: Build AmneziaWG for ImmortalWrt

# 用法：
# 1. 把本文件放到自己仓库的 .github/workflows/build-awg-immortalwrt.yml
# 2. 仓库 -> Actions -> Build AmneziaWG for ImmortalWrt -> Run workflow
# 3. 填入路由器的 target / subtarget（SSH 执行 . /etc/openwrt_release && echo $DISTRIB_TARGET）
# 4. 在任务页面底部 Artifacts 下载 .apk 包

on:
  workflow_dispatch:
    inputs:
      version:
        description: "ImmortalWrt 版本号（Status -> Overview 里能看到）"
        required: true
        default: "25.12.1"
      target:
        description: "target，例如 x86 / mediatek / ramips / rockchip"
        required: true
        default: "x86"
      subtarget:
        description: "subtarget，例如 64 / filogic / mt7621 / armv8"
        required: true
        default: "64"
      awg_repo:
        description: "AmneziaWG 包源码仓库"
        required: true
        default: "https://github.com/Slava-Shchipunov/awg-openwrt.git"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev file wget zstd curl

      - name: 下载并解压 ImmortalWrt SDK
        timeout-minutes: 25
        run: |
          set -e
          REL="releases/${{ inputs.version }}/targets/${{ inputs.target }}/${{ inputs.subtarget }}"
          for M in https://downloads.immortalwrt.org https://mirrors.vsean.net/openwrt; do
            BASE="$M/$REL"
            echo "== 尝试镜像 $M"
            SDK_FILE=$(curl -fsSL --max-time 60 "$BASE/" \
              | grep -oE 'immortalwrt-sdk-[^"<>]+\.tar\.zst' | head -n1) || continue
            [ -z "$SDK_FILE" ] && continue
            echo "SDK = $SDK_FILE"
            if wget --progress=dot:giga --tries=3 \
                 --timeout=30 --read-timeout=60 \
                 -O sdk.tar.zst "$BASE/$SDK_FILE"; then
              echo "下载成功：$M"; break
            fi
            rm -f sdk.tar.zst
          done
          test -s sdk.tar.zst
          mkdir sdk
          tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1
          ls sdk

      - name: 拉取 AmneziaWG 包源码
        working-directory: sdk
        run: |
          git clone --depth=1 "${{ inputs.awg_repo }}" package/awg
          rm -rf package/awg/.git package/awg/.github

      - name: 更新 feeds
        working-directory: sdk
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 生成配置
        working-directory: sdk
        run: |
          cat >> .config <<'EOF'
          CONFIG_PACKAGE_kmod-amneziawg=m            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev file wget zstd curl

      - name: 下载并解压 ImmortalWrt SDK
        run: |
          set -e
          BASE="https://downloads.immortalwrt.org/releases/${{ inputs.version }}/targets/${{ inputs.target }}/${{ inputs.subtarget }}"
          echo "从 $BASE 查找 SDK ..."
          SDK_FILE=$(curl -fsSL "$BASE/" \
            | grep -oE 'immortalwrt-sdk-[^"<>]+\.tar\.zst' | head -n1)
          if [ -z "$SDK_FILE" ]; then
            echo "没有找到 SDK，请确认 version/target/subtarget 是否正确"; exit 1
          fi
          echo "SDK = $SDK_FILE"
          wget -q "$BASE/$SDK_FILE"
          tar --zstd -xf "$SDK_FILE"
          mv "$(basename "$SDK_FILE" .tar.zst)" sdk

      - name: 拉取 AmneziaWG 包源码
        working-directory: sdk
        run: |
          git clone --depth=1 "${{ inputs.awg_repo }}" package/awg
          rm -rf package/awg/.git package/awg/.github

      - name: 更新 feeds
        working-directory: sdk
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 生成配置
        working-directory: sdk
        run: |
          cat >> .config <<'EOF'
          CONFIG_PACKAGE_kmod-amneziawg=m
          CONFIG_PACKAGE_amneziawg-tools=y
          CONFIG_PACKAGE_luci-proto-amneziawg=y
          CONFIG_PACKAGE_luci-app-amneziawg=y
          CONFIG_PACKAGE_luci-i18n-amneziawg-zh-cn=y
          EOF
          make defconfig
          echo "===== 已选中的 awg 相关配置 ====="
          grep -i amneziawg .config || true

      - name: 编译
        working-directory: sdk
        run: |
          make -j$(nproc) package/kmod-amneziawg/compile \
            || make -j1 V=s package/kmod-amneziawg/compile
          make -j$(nproc) package/amneziawg-tools/compile \
            || make -j1 V=s package/amneziawg-tools/compile
          make -j$(nproc) package/luci-proto-amneziawg/compile \
            || make -j1 V=s package/luci-proto-amneziawg/compile
          # AWG 2.0 才有 luci-app，失败不影响其它包
          make -j$(nproc) package/luci-app-amneziawg/compile || true

      - name: 收集产物
        run: |
          mkdir -p out
          find sdk/bin -type f \( -name "*amneziawg*.apk" -o -name "*amneziawg*.ipk" \) \
            -exec cp -v {} out/ \;
          echo "===== 产物列表 ====="
          ls -lh out/
          test -n "$(ls -A out/)"

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: amneziawg-${{ inputs.version }}-${{ inputs.target }}-${{ inputs.subtarget }}
          path: out/*
          if-no-files-found: error
