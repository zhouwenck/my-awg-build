name: Build AmneziaWG for ImmortalWrt

on:
  workflow_dispatch:
    inputs:
      version:
        description: "ImmortalWrt 版本号"
        required: true
        default: "25.12.1"
      target:
        description: "target，例如 x86 / mediatek / ramips / rockchip"
        required: true
        default: "x86"
      subtarget:
        description: "subtarget，例如 64 / filogic / mt7621 / armv8"
        required: true
        default: "64"
      awg_repo:
        description: "AmneziaWG 包源码仓库"
        required: true
        default: "https://github.com/Slava-Shchipunov/awg-openwrt.git"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 拉取 AmneziaWG 包源码
        run: |
          set -e
          git clone --depth=1 "${{ inputs.awg_repo }}" /tmp/awg
          mkdir -p awgsrc
          for p in kmod-amneziawg amneziawg-tools luci-proto-amneziawg luci-app-amneziawg; do
            if [ -d "/tmp/awg/$p" ]; then
              cp -r "/tmp/awg/$p" awgsrc/
              echo "已加入包目录: $p"
            fi
          done
          chmod -R a+rX awgsrc
          ls awgsrc

      - name: 选择可用的 SDK 镜像 tag
        id: pick
        run: |
          set -e
          V="${{ inputs.version }}"
          MINOR="$(echo "$V" | cut -d. -f1,2)"
          T="${{ inputs.target }}-${{ inputs.subtarget }}"
          for TAG in "$T-$V" "$T-$MINOR" "$T"; do
            echo "检测 immortalwrt/sdk:$TAG ..."
            if docker manifest inspect "immortalwrt/sdk:$TAG" >/dev/null 2>&1; then
              echo "arch=$TAG" >> "$GITHUB_OUTPUT"
              echo ">>> 使用 immortalwrt/sdk:$TAG"
              exit 0
            fi
          done
          echo "没有找到可用的 SDK 镜像，请检查 target/subtarget/version"
          exit 1

      - name: 编译
        run: |
          set -e
          mkdir -p out logs
          chmod 777 out logs
          docker run --rm \
            -v "$PWD/awgsrc:/src:ro" \
            -v "$PWD/out:/out" \
            -v "$PWD/logs:/logs" \
            immortalwrt/sdk:${{ steps.pick.outputs.arch }} \
            bash -c "
              set -e
              SDK=\$(ls -d /home/build/*/ 2>/dev/null | head -n1)
              if [ -z \"\$SDK\" ] || [ ! -x \"\$SDK/scripts/feeds\" ]; then
                echo '找不到 SDK 目录，容器内容如下：'; ls -la /home/build || ls -la /
                exit 1
              fi
              echo \">>> SDK 目录: \$SDK\"
              cd \"\$SDK\"

              cp -r /src/* package/
              ./scripts/feeds update -a
              ./scripts/feeds install -a

              printf '%s\n' \
                'CONFIG_PACKAGE_kmod-amneziawg=m' \
                'CONFIG_PACKAGE_amneziawg-tools=y' \
                'CONFIG_PACKAGE_luci-proto-amneziawg=y' >> .config
              make defconfig

              # 关键：自动修正 PKG_MIRROR_HASH
              for p in kmod-amneziawg amneziawg-tools luci-proto-amneziawg; do
                [ -d \"package/\$p\" ] || continue
                echo \">>> download \$p\"
                make \"package/\$p/download\" V=s
                echo \">>> check+fixup \$p\"
                make \"package/\$p/check\" FIXUP=1 V=s || true
                grep -H 'PKG_MIRROR_HASH' \"package/\$p/Makefile\" || true
              done

              echo '>>> 开始编译'
              make -j\$(nproc) package/kmod-amneziawg/compile V=s 2>&1 | tee /logs/kmod.log
              make -j\$(nproc) package/amneziawg-tools/compile V=s 2>&1 | tee /logs/tools.log
              make -j\$(nproc) package/luci-proto-amneziawg/compile V=s 2>&1 | tee /logs/luci.log

              find bin -type f \\( -name '*amneziawg*.apk' -o -name '*amneziawg*.ipk' \\) \
                -exec cp -v {} /out/ \\;
            "

      - name: 产物列表
        run: |
          ls -lh out/
          test -n "$(ls -A out/)"

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: amneziawg-${{ steps.pick.outputs.arch }}
          path: out/*
          if-no-files-found: error

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/
          if-no-files-found: ignore
