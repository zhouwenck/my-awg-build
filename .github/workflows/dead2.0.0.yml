name: Build daed 2.0.0 (dae v2.0.0 core) — 5 apks for ImmortalWrt 25.12.1 x86_64

on:
  workflow_dispatch:
    inputs:
      dae_ref:
        description: 'dae core tag'
        required: true
        default: 'v2.0.0'
      pkgver:
        description: 'apk 包版本'
        required: true
        default: '2.0.0'
      web_ref:
        description: '前端 web.zip 取哪个 daed release'
        required: true
        default: '1.27.0'

env:
  CGO_ENABLED: '0'
  SDK_URL: https://downloads.immortalwrt.org/releases/25.12.1/targets/x86/64/immortalwrt-sdk-25.12.1-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:

      # ════════ 第一部分：构建 daed 二进制（dae 2.0.0 核心）════════

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g pnpm

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm make git gzip \
            build-essential flex bison gawk gettext libncurses-dev \
            libssl-dev python3 rsync unzip zlib1g-dev file wget zstd swig time

      - name: Clone daed
        run: git clone --recursive https://github.com/daeuniverse/daed

      - name: Switch dae-core to ${{ inputs.dae_ref }}
        working-directory: daed/wing/dae-core
        run: |
          git fetch --tags origin
          git checkout ${{ inputs.dae_ref }}
          git submodule update --init --recursive
          git describe --tags --always | tee /tmp/01-core.log

      - name: Build eBPF
        working-directory: daed/wing/dae-core
        run: |
          set -o pipefail
          make ebpf 2>&1 | tee /tmp/02-ebpf.log

      - name: Wire dae-core into wing
        working-directory: daed/wing
        run: |
          set -o pipefail
          touch dae-core/control/bpf_bpfeb.o dae-core/control/bpf_bpfel.o
          grep -n replace go.mod | tee /tmp/03-mod.log || true
          go mod edit -replace github.com/daeuniverse/dae=./dae-core
          go mod tidy 2>&1 | tail -5 | tee -a /tmp/03-mod.log

      - name: Fix pnpm lockfile
        working-directory: daed
        run: |
          set -o pipefail
          pnpm install --no-frozen-lockfile 2>&1 | tail -20 | tee /tmp/04-pnpm.log

      - name: Build daed
        working-directory: daed
        run: |
          set -o pipefail
          SKIP_SUBMODULES=1 make \
            PFLAGS="CI=false HUSKY=0" \
            APPNAME=daed \
            OUTPUT=daed \
            VERSION=daed-dae${{ inputs.dae_ref }} \
            daed 2>&1 | tail -80 | tee /tmp/05-build.log

      - name: Gate — 核心必须是 ${{ inputs.dae_ref }}
        working-directory: daed
        run: |
          set -e
          CORE=$(git -C wing/dae-core describe --tags --always)
          { echo "dae-core = $CORE"; file daed; ./daed --version; } | tee /tmp/06-verify.log
          if [ "$CORE" != "${{ inputs.dae_ref }}" ]; then
            echo "::error::核心被重置成 $CORE，产物作废"
            exit 1
          fi
          mkdir -p /tmp/out && cp daed /tmp/out/

      # ════════ 第二部分：打成 5 个 apk ════════

      - name: Download SDK
        run: |
          wget -q "$SDK_URL" -O sdk.tar.zst
          mkdir sdk && tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1

      - name: Update feeds
        working-directory: sdk
        run: ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: Patch feed daed package
        working-directory: sdk
        run: |
          MK=feeds/packages/net/daed/Makefile
          mkdir -p prebuilt && cp /tmp/out/daed prebuilt/daed

          cp "$MK" /tmp/07-feed-makefile.log

          # 版本号；源码与前端 zip 一律不下载，改用桩文件
          sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=${{ inputs.pkgver }}/" "$MK"
          sed -i "s/^PKG_RELEASE:=.*/PKG_RELEASE:=1/" "$MK"
          sed -i "s|^PKG_MIRROR_HASH:=.*|PKG_MIRROR_HASH:=skip|" "$MK"
          sed -i "s|^PKG_BUILD_DEPENDS:=.*|PKG_BUILD_DEPENDS:=|" "$MK"

          # 覆盖块：跳过 Go 编译，直接用预编译二进制。
          # install 段照抄官方原文，只把二进制来源换掉。
          cat > /tmp/override.mk <<'EOF'

          # ---- 使用预编译 daed（dae 2.0.0 核心，前端已内嵌）----
          define Build/Prepare
          >mkdir -p $(PKG_BUILD_DIR)
          endef

          define Build/Configure
          endef

          define Build/Compile
          endef

          define Package/daed/install
          >$(INSTALL_DIR) $(1)/usr/bin
          >$(INSTALL_BIN) $(TOPDIR)/prebuilt/daed $(1)/usr/bin/daed
          >$(INSTALL_DIR) $(1)/etc/config
          >$(INSTALL_CONF) $(CURDIR)/files/daed.config $(1)/etc/config/daed
          >$(INSTALL_DIR) $(1)/etc/init.d
          >$(INSTALL_BIN) $(CURDIR)/files/daed.init $(1)/etc/init.d/daed
          endef
          EOF

          sed -i 's/^>/\t/' /tmp/override.mk
          cat /tmp/override.mk >> "$MK"

          {
            echo "=== 版本字段 ==="
            grep -E '^PKG_(NAME|VERSION|RELEASE|MIRROR_HASH|BUILD_DEPENDS)' "$MK"
            echo
            echo "=== 覆盖块（^I 应为 TAB）==="
            cat -A /tmp/override.mk
          } 2>&1 | tee /tmp/08-patch.log

      - name: Pre-seed downloads
        working-directory: sdk
        run: |
          set -o pipefail
          mkdir -p dl
          # 前端 zip：用 1.27.0 的真文件，HASH 校验能过
          wget -q "https://github.com/daeuniverse/daed/releases/download/v${{ inputs.web_ref }}/web.zip" \
            -O "dl/daed-web-${{ inputs.pkgver }}.zip"
          # 源码 tarball：Build/Prepare 已被覆盖，用空桩即可（MIRROR_HASH 已设 skip）
          tar -cf - --files-from /dev/null | zstd -q -o "dl/daed-${{ inputs.pkgver }}.tar.zst"
          ls -l dl/ | tee /tmp/12-preseed.log

      - name: Build 5 packages
        working-directory: sdk
        run: |
          set -o pipefail
          cat >> .config <<'EOF'
          CONFIG_PACKAGE_daed=m
          CONFIG_PACKAGE_daed-geoip=m
          CONFIG_PACKAGE_daed-geosite=m
          CONFIG_PACKAGE_luci-app-daed=m
          CONFIG_PACKAGE_luci-i18n-daed-zh-cn=m
          EOF
          make defconfig
          make package/feeds/packages/daed/compile V=s -j$(nproc) 2>&1 \
            | tail -60 | tee /tmp/09-daed.log
          make package/feeds/luci/luci-app-daed/compile V=s -j$(nproc) 2>&1 \
            | tail -40 | tee /tmp/10-luci.log

      - name: List output
        if: always()
        working-directory: sdk
        run: |
          echo "=== 产物 ===" > /tmp/11-output.log
          find bin/packages -name '*daed*' >> /tmp/11-output.log 2>/dev/null || true
          cat /tmp/11-output.log
          exit 0

      - name: Result
        if: always()
        run: |
          {
            echo "## daed ${{ inputs.pkgver }} / dae-core ${{ inputs.dae_ref }}"
            echo ""
            echo '```'
            cat /tmp/06-verify.log 2>/dev/null
            echo '```'
            echo ""
            echo '```'
            cat /tmp/11-output.log 2>/dev/null
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daed-${{ inputs.pkgver }}-x86_64
          path: |
            /tmp/*.log
            /tmp/out/daed
            sdk/bin/packages/x86_64/*/*daed*.apk
          retention-days: 30
