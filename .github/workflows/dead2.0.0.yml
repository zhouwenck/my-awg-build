name: Inspect daed build system

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g pnpm
      - run: sudo apt-get update && sudo apt-get install -y clang llvm make git

      - name: Clone
        run: git clone --recursive https://github.com/daeuniverse/daed

      - name: Dump Makefiles
        working-directory: daed
        run: |
          {
            echo "########## 根 Makefile ##########"
            cat -n Makefile
            echo
            echo "########## .gitmodules.d.mk ##########"
            cat .gitmodules.d.mk
            echo
            echo "########## wing/Makefile ##########"
            cat -n wing/Makefile
            echo
            echo "########## Dockerfile（官方构建流程参考）##########"
            cat Dockerfile
          } 2>&1 | tee /tmp/10-makefiles.log

      - name: Try official build (v1.1.0 core, 验证工具链)
        id: try
        continue-on-error: true
        working-directory: daed
        env:
          CGO_ENABLED: '0'
        run: |
          set -o pipefail
          make daed 2>&1 | tail -100 | tee /tmp/11-make-daed.log

      - name: What got produced
        if: always()
        working-directory: daed
        run: |
          {
            echo "=== 可执行产物 ==="
            find . -maxdepth 3 -type f -perm -u+x -size +3M \
              -not -path "*/node_modules/*" -not -path "*/.git/*"
            echo
            echo "=== dist 在哪 ==="
            find . -maxdepth 4 -type d -name dist -not -path "*/node_modules/*"
            echo
            echo "=== 构建后 dae-core 指向 ==="
            git -C wing/dae-core describe --tags --always
          } 2>&1 | tee /tmp/12-output.log

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daed-inspect
          path: /tmp/*.log
          retention-days: 30
