name: Probe v2 - daed with dae 2.0.0 core

on:
  workflow_dispatch:
    inputs:
      dae_ref:
        description: 'dae core 的 tag 或分支'
        required: true
        default: 'v2.0.0'

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm make git

      - name: Clone daed
        run: git clone --recursive https://github.com/daeuniverse/daed

      - name: Switch dae-core to ${{ inputs.dae_ref }}
        working-directory: daed/wing/dae-core
        run: |
          git fetch --tags origin
          git checkout ${{ inputs.dae_ref }}
          git submodule update --init --recursive
          git log -1 --oneline | tee /tmp/01-core.log

      - name: Inspect wing build system
        working-directory: daed/wing
        run: |
          {
            echo "=== Makefile 目标 ==="
            grep -nE '^[a-zA-Z0-9_.-]+:' Makefile 2>/dev/null || echo "(无 Makefile)"
            echo
            echo "=== go:generate 指令 ==="
            grep -rn "go:generate" --include="*.go" . | head -20
            echo
            echo "=== global 包在哪 ==="
            find . -type d -name global -not -path "./dae-core/*"
            echo
            echo "=== global 包内容 ==="
            ls -la graphql/service/config/global/ 2>/dev/null || echo "(该路径不存在)"
            echo
            echo "=== config 包 import 了什么 ==="
            head -20 graphql/service/config/resolver.go
          } 2>&1 | tee /tmp/02-inspect.log

      - name: Build eBPF objects
        id: ebpf
        continue-on-error: true
        working-directory: daed/wing/dae-core
        run: |
          set -o pipefail
          make ebpf 2>&1 | tee /tmp/03-ebpf.log

      - name: Prepare deps
        id: deps
        continue-on-error: true
        working-directory: daed/wing
        run: |
          set -o pipefail
          touch dae-core/control/bpf_bpfeb.o dae-core/control/bpf_bpfel.o || true
          go mod edit -replace github.com/daeuniverse/dae=./dae-core
          go mod tidy 2>&1 | tee /tmp/04-tidy.log

      - name: Run code generation
        id: gen
        continue-on-error: true
        working-directory: daed/wing
        run: |
          set -o pipefail
          if grep -qE '^deps:' Makefile 2>/dev/null; then
            echo "--- make deps ---" | tee /tmp/05-gen.log
            make deps 2>&1 | tee -a /tmp/05-gen.log
          else
            echo "--- go generate ./... ---" | tee /tmp/05-gen.log
            go generate ./... 2>&1 | tee -a /tmp/05-gen.log
          fi
          echo "--- 生成后的 global 包 ---" | tee -a /tmp/05-gen.log
          ls -la graphql/service/config/global/ 2>&1 | tee -a /tmp/05-gen.log

      - name: go build
        id: gobuild
        continue-on-error: true
        working-directory: daed/wing
        run: |
          set -o pipefail
          go build ./... 2>&1 | tee /tmp/06-build.log

      - name: Result
        run: |
          {
            echo "## dae-core = ${{ inputs.dae_ref }}"
            echo ""
            echo "| 阶段 | 结果 |"
            echo "|---|---|"
            echo "| eBPF | ${{ steps.ebpf.outcome }} |"
            echo "| mod tidy | ${{ steps.deps.outcome }} |"
            echo "| 代码生成 | ${{ steps.gen.outcome }} |"
            echo "| go build | ${{ steps.gobuild.outcome }} |"
            echo ""
            if [ "${{ steps.gobuild.outcome }}" = "success" ]; then
              echo "**编译通过**"
            else
              echo '```'
              tail -40 /tmp/06-build.log 2>/dev/null || echo "(无日志)"
              echo '```'
            fi
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe2-${{ inputs.dae_ref }}
          path: /tmp/*.log
