name: Build daed with dae 2.0.0

on:
  workflow_dispatch:
    inputs:
      dae_ref:
        description: 'dae core tag'
        required: true
        default: 'v2.0.0'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install -g pnpm

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm make git

      - name: Clone daed
        run: git clone --recursive https://github.com/daeuniverse/daed

      - name: Switch dae-core to ${{ inputs.dae_ref }}
        working-directory: daed/wing/dae-core
        run: |
          git fetch --tags origin
          git checkout ${{ inputs.dae_ref }}
          git submodule update --init --recursive
          git log -1 --oneline | tee /tmp/01-core.log

      - name: Inspect daed root build system
        working-directory: daed
        run: |
          {
            echo "=== 根 Makefile 目标 ==="
            grep -nE '^[a-zA-Z0-9_.-]+:' Makefile 2>/dev/null || echo "(无根 Makefile)"
            echo
            echo "=== 根目录 ==="
            ls -la
            echo
            echo "=== package.json scripts ==="
            grep -A15 '"scripts"' package.json 2>/dev/null || echo "(无 package.json)"
          } 2>&1 | tee /tmp/02-inspect.log

      - name: Build eBPF
        id: ebpf
        continue-on-error: true
        working-directory: daed/wing/dae-core
        run: |
          set -o pipefail
          make ebpf 2>&1 | tee /tmp/03-ebpf.log

      - name: Build daed
        id: build
        continue-on-error: true
        working-directory: daed
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          set -o pipefail
          go mod edit -replace github.com/daeuniverse/dae=./dae-core -C wing || true
          make deps 2>&1 | tee /tmp/04-build.log
          make 2>&1 | tee -a /tmp/04-build.log

      - name: Locate binary
        if: always()
        working-directory: daed
        run: |
          {
            echo "=== 产物 ==="
            find . -maxdepth 3 -type f -perm -u+x -size +5M -not -path "*/node_modules/*" -not -path "*/.git/*"
          } 2>&1 | tee /tmp/05-artifact.log

      - name: Verify
        if: always()
        working-directory: daed
        run: |
          B=$(find . -maxdepth 3 -type f -name daed -perm -u+x | head -1)
          if [ -n "$B" ]; then
            file "$B" | tee -a /tmp/05-artifact.log
            "$B" --version 2>&1 | tee -a /tmp/05-artifact.log || true
            mkdir -p /tmp/out && cp "$B" /tmp/out/
          else
            echo "没找到 daed 二进制" | tee -a /tmp/05-artifact.log
          fi

      - name: Result
        if: always()
        run: |
          {
            echo "## daed + dae-core ${{ inputs.dae_ref }}"
            echo ""
            echo "| 阶段 | 结果 |"
            echo "|---|---|"
            echo "| eBPF | ${{ steps.ebpf.outcome }} |"
            echo "| build | ${{ steps.build.outcome }} |"
            echo ""
            echo '```'
            cat /tmp/05-artifact.log 2>/dev/null | tail -20
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daed-${{ inputs.dae_ref }}
          path: |
            /tmp/*.log
            /tmp/out/*
          retention-days: 30
