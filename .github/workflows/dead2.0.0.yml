name: Build daed with dae 2.0.0

on:
  workflow_dispatch:
    inputs:
      dae_ref:
        description: 'dae core tag'
        required: true
        default: 'v2.0.0'

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g pnpm
      - run: sudo apt-get update && sudo apt-get install -y clang llvm make git gzip

      - name: Clone
        run: git clone --recursive https://github.com/daeuniverse/daed

      - name: Switch dae-core to ${{ inputs.dae_ref }}
        working-directory: daed/wing/dae-core
        run: |
          git fetch --tags origin
          git checkout ${{ inputs.dae_ref }}
          git submodule update --init --recursive
          git describe --tags --always | tee /tmp/01-core.log

      - name: Build eBPF
        working-directory: daed/wing/dae-core
        run: |
          set -o pipefail
          make ebpf 2>&1 | tee /tmp/02-ebpf.log

      - name: Wire dae-core into wing
        working-directory: daed/wing
        run: |
          set -o pipefail
          touch dae-core/control/bpf_bpfeb.o dae-core/control/bpf_bpfel.o
          echo "=== 原 go.mod replace ===" | tee /tmp/03-mod.log
          grep -n replace go.mod 2>&1 | tee -a /tmp/03-mod.log || true
          go mod edit -replace github.com/daeuniverse/dae=./dae-core
          go mod tidy 2>&1 | tail -5 | tee -a /tmp/03-mod.log

      - name: Fix lockfile
        working-directory: daed
        run: |
          set -o pipefail
          pnpm install --no-frozen-lockfile 2>&1 | tail -20 | tee /tmp/04-pnpm.log

      - name: Build daed
        id: build
        continue-on-error: true
        working-directory: daed
        run: |
          set -o pipefail
          SKIP_SUBMODULES=1 make \
            PFLAGS="CI=false HUSKY=0" \
            APPNAME=daed \
            OUTPUT=daed \
            VERSION=daed-dae${{ inputs.dae_ref }} \
            daed 2>&1 | tail -80 | tee /tmp/05-build.log

      - name: Verify
        if: always()
        working-directory: daed
        run: |
          {
            echo "=== 构建后 dae-core 指向（必须是 ${{ inputs.dae_ref }}）==="
            git -C wing/dae-core describe --tags --always
            echo
            echo "=== 产物 ==="
            ls -lh daed 2>/dev/null || echo "没有 daed"
            file daed 2>/dev/null || true
            echo
            echo "=== 版本 ==="
            ./daed --version 2>&1 || true
          } 2>&1 | tee /tmp/06-verify.log
          mkdir -p /tmp/out && cp daed /tmp/out/ 2>/dev/null || true

      - name: Result
        if: always()
        run: |
          {
            echo "## daed + dae-core ${{ inputs.dae_ref }}"
            echo ""
            echo "build: ${{ steps.build.outcome }}"
            echo ""
            echo '```'
            cat /tmp/06-verify.log 2>/dev/null
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daed-${{ inputs.dae_ref }}
          path: |
            /tmp/*.log
            /tmp/out/*
          retention-days: 30
