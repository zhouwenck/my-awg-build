name: Build dae 2.0.0 + luci-app-dae

on:
  workflow_dispatch:

env:
  SDK_URL: https://downloads.immortalwrt.org/releases/25.12.1/targets/x86/64/immortalwrt-sdk-25.12.1-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
  DAE_VERSION: 2.0.0
  DAE_HASH: 89853731fbc6ca60e4a68644e774fa45927fc53e7c05b19b9308fc938b1b98c2

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm flex bison gawk \
            gettext git libncurses-dev libssl-dev python3 rsync unzip \
            zlib1g-dev file wget zstd swig time

      - name: Download SDK
        run: |
          wget -q "$SDK_URL" -O sdk.tar.zst
          mkdir sdk && tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1

      - name: Update feeds
        working-directory: sdk
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Show original Makefile
        working-directory: sdk
        run: cat feeds/packages/net/dae/Makefile

      - name: Bump to dae ${{ env.DAE_VERSION }}
        working-directory: sdk
        run: |
          MK=feeds/packages/net/dae/Makefile
          sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=$DAE_VERSION/" $MK
          sed -i "s/^PKG_RELEASE:=.*/PKG_RELEASE:=1/" $MK
          sed -i "s/^PKG_HASH:=.*/PKG_HASH:=$DAE_HASH/" $MK

      - name: Build
        working-directory: sdk
        run: |
          cat >> .config <<'EOF'
          CONFIG_PACKAGE_dae=m
          CONFIG_PACKAGE_luci-app-dae=m
          CONFIG_PACKAGE_luci-i18n-dae-zh-cn=m
          EOF
          make defconfig
          make package/feeds/packages/dae/compile V=s -j$(nproc)
          make package/feeds/luci/luci-app-dae/compile V=s -j$(nproc)

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: dae-${{ env.DAE_VERSION }}-x86_64
          path: |
            sdk/bin/packages/x86_64/packages/dae*.apk
            sdk/bin/packages/x86_64/luci/luci-*dae*.apk
